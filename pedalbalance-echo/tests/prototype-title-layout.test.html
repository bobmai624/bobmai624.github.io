<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype title layout regression</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <div class="prototype-overlay">
    <section class="prototype-dialog">
      <header class="prototype-header"><b>PEDALBALANCE ECHO</b></header>
      <div class="prototype-body">
        <ol class="prototype-progress"><li>LAYOUT TEST</li></ol>
        <div class="prototype-stage">
          <div class="prototype-copy" style="justify-content:flex-start">
            <h2 data-layout-title>先看懂这一圈，<br>到底发生了什么。</h2>
            <h2 data-layout-title>三个模块，<br>各自只做一件事。</h2>
            <h2 data-layout-title>提示不是答案，<br>只是一次介入。</h2>
            <h2 data-layout-title>实验改变什么，<br>一次说清楚。</h2>
            <h2 data-layout-title>数字放在机制旁边，<br>不藏在表格里。</h2>
            <h2 data-layout-title>四个条件，<br>每一步都可执行。</h2>
            <h2 data-layout-title>机器返回的是过去的我，<br>还是一条相似曲线？</h2>
            <h2 data-layout-title>训练只是中间，<br>撤除以后才开始验证。</h2>
            <h2 data-layout-title>最后分开两件事：<br>机器帮到了，还是人学会了？</h2>
          </div>
          <div class="prototype-visual" aria-label="Column boundary"></div>
        </div>
      </div>
      <footer class="prototype-footer"><span>LAYOUT TEST</span></footer>
    </section>
  </div>
  <script>
    requestAnimationFrame(() => {
      const titles = [...document.querySelectorAll('[data-layout-title]')];
      const overflow = titles.map((title) => Math.max(0, title.scrollWidth - title.clientWidth));
      document.documentElement.dataset.maxTitleOverflow = String(Math.max(...overflow));
      document.documentElement.dataset.titleLayout = overflow.every((value) => value === 0) ? 'pass' : 'fail';
    });
  </script>
</body>
</html>
