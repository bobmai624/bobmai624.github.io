<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Linghang responsible workflow model</title>
  <desc id="desc">A three-layer model separates service context, repeatable workflow support and retained human controls.</desc>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="84" y="82" font-size="21" letter-spacing="4" fill="#64806f">WORKFLOW MODEL · RESPONSIBILITY REMAINS VISIBLE</text>
    <text x="84" y="166" font-size="56" font-weight="700">What is mapped, what is supported, what stays human</text>
    <text x="84" y="218" font-size="24" fill="#696862">The model separates repeated operational work from consequential client decisions.</text>
  </g>
  <g transform="translate(84 302)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="1432" height="152" fill="#f4f2ed" stroke="#171717" stroke-width="2"/>
      <rect width="210" height="152" fill="#171717"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#9db5a6">01</text>
      <text x="24" y="96" font-size="27" font-weight="700" fill="#fff">MAP</text>
      <text x="252" y="62" font-size="27" font-weight="700" fill="#171717">Service and client context</text>
      <text x="252" y="105" font-size="21" fill="#686762">Goals · background · eligibility · timing · risks · task ownership</text>
    </g>
    <g transform="translate(0 194)">
      <rect width="1432" height="190" fill="#dce5df" stroke="#171717" stroke-width="2"/>
      <rect width="210" height="190" fill="#64806f"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#fff">02</text>
      <text x="24" y="96" font-size="27" font-weight="700" fill="#fff">SUPPORT</text>
      <text x="252" y="56" font-size="27" font-weight="700" fill="#171717">Repeatable operational work</text>
      <g fill="#fff" stroke="#171717" stroke-width="2">
        <rect x="252" y="88" width="245" height="62"/>
        <rect x="524" y="88" width="245" height="62"/>
        <rect x="796" y="88" width="245" height="62"/>
        <rect x="1068" y="88" width="278" height="62"/>
      </g>
      <g font-size="19" fill="#171717">
        <text x="374" y="126" text-anchor="middle">Research</text>
        <text x="646" y="126" text-anchor="middle">Document checks</text>
        <text x="918" y="126" text-anchor="middle">Template use</text>
        <text x="1207" y="126" text-anchor="middle">Knowledge reuse</text>
      </g>
    </g>
    <g transform="translate(0 426)">
      <rect width="1432" height="190" fill="#171717"/>
      <rect width="210" height="190" fill="#0c0c0c" stroke="#64806f" stroke-width="2"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#9db5a6">03</text>
      <text x="24" y="96" font-size="27" font-weight="700" fill="#fff">REVIEW</text>
      <text x="252" y="56" font-size="27" font-weight="700" fill="#fff">Retained human controls</text>
      <g fill="none" stroke="#9db5a6" stroke-width="2">
        <rect x="252" y="88" width="245" height="62"/>
        <rect x="524" y="88" width="245" height="62"/>
        <rect x="796" y="88" width="245" height="62"/>
        <rect x="1068" y="88" width="278" height="62"/>
      </g>
      <g font-size="19" fill="#fff">
        <text x="374" y="126" text-anchor="middle">Source validation</text>
        <text x="646" y="126" text-anchor="middle">Human review</text>
        <text x="918" y="126" text-anchor="middle">Privacy</text>
        <text x="1207" y="126" text-anchor="middle">Exception handling</text>
      </g>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="958" font-size="21" fill="#64806f">ONGOING ROLE · ONLY COMPLETED MATERIALS INCLUDED</text>
    <text x="1516" y="958" text-anchor="end" font-size="21" fill="#171717">Automation does not choose a client’s path.</text>
  </g>
</svg>
