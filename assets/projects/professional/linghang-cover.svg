<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Linghang responsible digital workflows</title>
  <desc id="desc">A responsible automation diagram that keeps source validation, privacy, human review and exception handling around the workflow.</desc>
  <rect width="1600" height="1000" fill="#f4f2ed"/>
  <path d="M0 0h22v1000H0z" fill="#64806f"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="94" y="72" font-size="23" letter-spacing="5">DIGITAL CONSULTING · ONGOING</text>
    <text x="94" y="214" font-size="83" font-weight="700">LINGHANG</text>
    <text x="94" y="304" font-size="65" font-weight="400">RESPONSIBLE DIGITAL WORKFLOWS</text>
    <text x="98" y="370" font-size="27" fill="#5e5d59">Repeated tasks supported by automation · consequential decisions reviewed by people</text>
  </g>
  <g transform="translate(94 476)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="342" height="242" fill="#fff" stroke="#171717" stroke-width="2"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#64806f">CLIENT CONTEXT</text>
      <text x="24" y="98" font-size="28" font-weight="700" fill="#171717">Goals · background</text>
      <text x="24" y="137" font-size="24" fill="#686762">Eligibility · timing</text>
      <text x="24" y="176" font-size="24" fill="#686762">Risks</text>
    </g>
    <path d="M342 121h88" stroke="#171717" stroke-width="2"/>
    <path d="m418 110 12 11-12 11" fill="none" stroke="#171717" stroke-width="2"/>
    <g transform="translate(430)">
      <rect width="430" height="242" fill="#dce5df" stroke="#171717" stroke-width="2"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#526b5d">BOUNDED SUPPORT</text>
      <text x="24" y="98" font-size="28" font-weight="700" fill="#171717">Research · checking</text>
      <text x="24" y="137" font-size="24" fill="#59615c">Templates · knowledge reuse</text>
      <text x="24" y="190" font-size="18" fill="#526b5d">UiPath · RPA · Codex</text>
    </g>
    <path d="M860 121h88" stroke="#171717" stroke-width="2"/>
    <path d="m936 110 12 11-12 11" fill="none" stroke="#171717" stroke-width="2"/>
    <g transform="translate(948)">
      <rect width="464" height="242" fill="#171717"/>
      <text x="24" y="48" font-size="18" letter-spacing="3" fill="#9db5a6">HUMAN RESPONSIBILITY</text>
      <text x="24" y="98" font-size="28" font-weight="700" fill="#fff">Validate · review</text>
      <text x="24" y="137" font-size="24" fill="#c8c7c2">Protect privacy</text>
      <text x="24" y="176" font-size="24" fill="#c8c7c2">Handle exceptions</text>
    </g>
  </g>
  <g transform="translate(94 781)" font-family="Arial, Helvetica, sans-serif">
    <path d="M0 0h1414" stroke="#171717" stroke-width="2"/>
    <text x="0" y="58" font-size="18" letter-spacing="3" fill="#64806f">DECISION BOUNDARY</text>
    <text x="0" y="112" font-size="25" fill="#171717">Automation supports organisation</text>
    <text x="1414" y="112" text-anchor="end" font-size="25" fill="#171717">People remain responsible for the path</text>
    <text x="1414" y="170" text-anchor="end" font-size="19" letter-spacing="3" fill="#64806f">BOWEN MAI</text>
  </g>
